# @package agent
_target_: agent.mimdice_1.MIMAgent
name: mimdice_1

# ===== runtime/common =====
reward_free: ${reward_free}
obs_type: ???          # to be specified later
obs_shape: ???         # to be specified later
action_shape: ???      # to be specified later
device: ${device}
use_tb: ${use_tb}
use_wandb: ${use_wandb}
num_expl_steps: ???    # to be specified later

# ===== optim/schedule =====
lr: 1e-4
critic_target_tau: 0.01
update_every_steps: 2
batch_size: 1024
stddev_schedule: 0.2
stddev_clip: 0.3
update_task_every_step: 50

# ===== model dims =====
hidden_dim: 1024        
feature_dim: 50
sf_dim: 64
skill_dim: 64 #for integration

# ===== MIM / RL hyper =====
gamma: 0.99
alpha: 0.05              

d_hidden: 1024         
num_d_layer: 1
d_s_z_lr: 0.4
phi_lr: 0.3

# ===== misc / compat =====
nstep: 3
init_critic: true
update_encoder: ${update_encoder}
lstsq_batch_size: 4096
